name: Build and Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compute version
        id: version
        run: |
          echo "version_name=2.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease \
            -PappVersionName=${{ steps.version.outputs.version_name }} \
            -PappVersionCode=${{ steps.version.outputs.version_code }} 2>&1 | tee build.log

      - name: Post build errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Build failed - Gradle errors"
            echo '```'
            if [ -f build.log ]; then
              grep -n -i -E "error:|FAILED|What went wrong|Could not|requires libraries|Caused by|Execution failed|Duplicate class|incompatible|not found" -A4 build.log | head -120
            else
              echo "no build.log (a step before the build failed)"
            fi
            echo '```'
          } > fail.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@fail.md

      - name: Sign APK with the permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is missing - refusing to publish an APK with a different signature"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release-signed.apk | grep -i "SHA-256"
          rm -f release.keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: "Version ${{ steps.version.outputs.version_name }}"
          files: app/build/outputs/apk/release/app-release-signed.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
