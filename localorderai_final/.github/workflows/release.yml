name: Build and Release APK

# بيشتغل تلقائيًا لما تعمل push لأي tag يبدأ بـ v (زي v1.1.0)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # بياخد رقم النسخة من اسم الـ tag نفسه (v1.1.0 -> 1.1.0)
      # ويحطه في versionName أوتوماتيك، عشان متنساش تحدثه يدوي
      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG_NAME#v}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set versionName in build.gradle
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" app/build.gradle
          cat app/build.gradle | grep versionName

      - name: Build release APK
        run: ./gradlew assembleRelease

      # لو عندك keystore حقيقي للتوقيع، الخطوة دي هتوقّع الـ APK.
      # من غير ما تضيف السيكريتس دول، الـ APK هيتبني unsigned
      # (يشتغل للتجربة بس مش نظيف للتوزيع الرسمي).
      - name: Sign APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" -type f | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Locate final APK
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release-signed.apk ]; then
            echo "path=app/build/outputs/apk/release/app-release-signed.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_OUTPUT"
          fi

      # بينشر الـ Release ويرفق الـ APK كـ asset تلقائيًا
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Version ${{ steps.version.outputs.version_name }}"
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
