plugins {
    id 'com.android.application'
}

android {
    namespace 'com.localorderai'
    compileSdk 34

    defaultConfig {
        applicationId "com.localorderai"
        minSdk 29
        targetSdk 34
        // بيتحددوا من الـ workflow (versionCode لازم يزيد مع كل إصدار عشان التحديث يتقبل)
        versionCode Integer.parseInt((project.findProperty('appVersionCode') ?: '1').toString())
        versionName (project.findProperty('appVersionName') ?: '2.0.0').toString()
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
