plugins {
    id 'com.android.application'
}

android {
    namespace 'com.localorderai'
    compileSdk 34

    defaultConfig {
        applicationId "com.localorderai"
        minSdk 29
        targetSdk 34
        // مكتبات القراءة (ML Kit وTesseract) كبيرة لكل نوع معالج: بنقتصر على 64-بت (كل موبايلات سامسونج الحديثة) عشان حجم التحديث
        ndk {
            abiFilters 'arm64-v8a'
        }
        // بيتحددوا من الـ workflow (versionCode لازم يزيد مع كل إصدار عشان التحديث يتقبل)
        versionCode Integer.parseInt((project.findProperty('appVersionCode') ?: '1').toString())
        versionName (project.findProperty('appVersionName') ?: '2.0.0').toString()
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // نسخة Kotlin واحدة لكل المكتبات (ML Kit وTesseract بيسحبوا نسخ مختلفة وبتتعارض)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    // قراءة الورقة محلياً: ML Kit (لاتيني) + Tesseract (عربي وإنجليزي)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
